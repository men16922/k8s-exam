apiVersion: v1
kind: Pod
metadata:
  name: init-cont-pod
spec:
  initContainers:
    - name: init-cintainer
      image: alpine
      command: ['sh', '-c', 'touch /workdir/test.txt']
      volumeMounts:
        - name: initvolume
          mountPath: /workdir

  containers:
    - name: main-container
      image: alpine
      command: ['sh', '-c', 'if [ -f /workdir/test.txt ]; then sleep 9999; else exit 1; fi']
      volumeMounts:
        - name: initvolume
          mountPath: /workdir

  volumes:
    - name: initvolume
      emptyDir: {}
  restartPolicy: Never
