apiVersion: v1
kind: Secret
metadata:
  name: mysecret
type: Opaque
stringData:
  username: admin
  password: p@ssw0rd
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-secret-env
spec:
  containers:
    - name: nginx
      image: nginx
      envFrom:
        - secretRef:
            name: mysecret
