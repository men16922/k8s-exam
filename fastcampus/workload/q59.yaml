apiVersion: v1
kind: Pod
metadata:
  name: pod-secrets-via-file
spec:
  containers:
    - image: redis
      name: redis
      volumeMounts:
        - name: foo
          mountPath:  /secrets
  volumes:
    - name: foo
      secret:
        secretName: super-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-secrets-via-env
spec:
  containers:
    - name: redis
      image: redis
      env:
        - name: CONFIDENTIAL
          valueFrom:
            secretKeyRef:
              name: super-secret
              key: password